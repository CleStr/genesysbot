services:
  - type: web
    name: genesysbot
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: ADMIN_PASSWORD
        sync: false
      - key: FHG_BASE_URL
        value: https://fhgenie.fraunhofer.de/v1
